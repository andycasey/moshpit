[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moshpit"
version = "0.1.0"
description = "JIT-compiled PSF photometry for JAX"
readme = "README_PACKAGE.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "jax>=0.4.0",
    "jaxtyping>=0.2.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["src/moshpit*"]
exclude = ["examples*", "tests*"]
